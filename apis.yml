aid: bitnomial
name: Bitnomial
description: >-
  Bitnomial is a Chicago-based derivatives exchange company that owns and
  operates U.S. CFTC-regulated subsidiaries — a Designated Contract Market
  (exchange/DCM), a Derivatives Clearing Organization (clearinghouse/DCO), and a
  Futures Commission Merchant (clearing brokerage/FCM). It offers leveraged spot,
  perpetuals, futures, options, and prediction markets on a single regulated
  venue with crypto margin and settlement. For developers, Bitnomial publishes a
  public HTTPS REST API (products, orders, fills, block trades, indexes, funding
  rates, market stats), a real-time WebSocket market-data feed (trade, book,
  block, status channels), a low-latency binary order-entry protocol (BTP), and
  a FIX 4.4 API with dropcopy. REST authentication uses HMAC-SHA256 request
  signing with per-connection credentials. Surfaced as a portfolio company of
  Electric Capital and enriched by the API Evangelist pipeline.
